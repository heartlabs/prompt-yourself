# Companion: serves the static PWA on :80 and proxies the push API to the
# Rust backend on :4000. The frontend uses same-origin /api/* fetches
# (app/js/notify.js), so this proxy keeps the app code unchanged.
server {
    listen 80;
    server_name _;

    root /srv/app;
    index index.html;

    # Push API → Rust backend (full URI is forwarded, e.g. /api/health)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: anything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebKit caches sw.js if the response is cacheable, and the SW update
    # check then compares stale bytes → the PWA never updates (the classic
    # "desktop updated, iPhone didn't"). Force revalidation every time.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires 0;
        try_files $uri =404;
    }

    # index.html is the entry the page loads; keep it revalidating too so a
    # fresh visit sees the newest shell (everything else is versioned by the
    # service worker cache).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires 0;
        try_files $uri =404;
    }
}
