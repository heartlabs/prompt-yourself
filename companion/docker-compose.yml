version: "3.9"

services:
  companion:
    # Runtime-only build: CI ships a prebuilt release binary (see
    # .github/release-companion.yml), so the server never compiles Rust.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion
    restart: unless-stopped
    ports:
      - "80:80"     # frontend — your reverse proxy points here
      - "4000:4000" # backend API — healthchecks / debugging
    networks:
      - companionnet
    volumes:
      # Server state: VAPID keys, push subscription, schedule.
      # Deleting this volume breaks push until notifications are re-enabled
      # on the phone — keep it.
      - companion_state:/srv/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  companion_state:

networks:
  companionnet:
    name: companion_network
