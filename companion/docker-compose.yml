version: "3.9"

services:
  companion:
    # Runtime-only build: CI ships a prebuilt release binary (see
    # .github/release-companion.yml), so the server never compiles Rust.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion
    restart: unless-stopped
    # No host ports are published: the container is only reachable on
    # companion_network (same per-app pattern as the other apps on this
    # server, e.g. needs_network). The reverse proxy is connected to that
    # network and routes to http://companion:80 (TLS terminates at the
    # proxy). The healthcheck runs inside the container against
    # localhost:4000, so no port needs to be exposed to the host.
    #
    # Local debugging: uncomment to publish ports on the host. Keep this
    # commented on the server (port 80 there is owned by the reverse proxy —
    # that was the "port is already allocated" conflict). On your machine,
    # use 8080:80 instead of 80:80 if port 80 is already taken:
    # ports:
    #   - "80:80"     # frontend
    #   - "4000:4000" # backend API / healthchecks
    networks:
      - companionnet
    volumes:
      # Server state: VAPID keys, push subscription, schedule.
      # Deleting this volume breaks push until notifications are re-enabled
      # on the phone — keep it.
      - companion_state:/srv/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  companion_state:

networks:
  # Per-app network, same convention as the other apps on this server
  # (e.g. needs_network). Compose creates it if missing.
  companionnet:
    name: companion_network
